name: Check static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check shared content, links, and page structure
        run: python3 scripts/check_site.py
      - name: Check content update behavior
        run: python3 -m unittest discover -s tests -v
